<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ほしひろい</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#e6ecf6; --ink:#17213a; --muted:#5a6788;
  --btn:#cfd9ec; --btn-press:#b3c2e0; --btn-ink:#17213a;
  /* ステージ（夜の設計図）は明暗どちらでも同じ色 */
  --stage:#1b2747; --grid:#24345c; --brick:#d99a3c; --brick-edge:#a96f22;
  --ladder:#9fb4d9; --bar:#c7d3ea; --player:#ffffff;
  --e1:#ff7a8a; --e2:#7ee0c3; --e3:#b79cff; --e4:#ffb86b;
  --star:#ffd84d; --door:#7ee0c3; --friend:#8fd3ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0f1629; --ink:#e3e9f6; --muted:#8d9bbd;
    --btn:#1f2c4d; --btn-press:#2c3d68; --btn-ink:#e3e9f6;
  }
}
:root[data-theme="dark"]{
  --page:#0f1629; --ink:#e3e9f6; --muted:#8d9bbd;
  --btn:#1f2c4d; --btn-press:#2c3d68; --btn-ink:#e3e9f6;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;height:100%;background:var(--page);color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.app{height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;padding:8px 12px 10px;gap:8px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:.02em}
.hud{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 11px;font-weight:800;font-size:.95rem;font-variant-numeric:tabular-nums}
.hud span{white-space:nowrap}
.hud .star{color:#d69e00}
:root:not([data-theme="light"]) .hud .star{color:var(--star)}
.stage{flex:1 1 auto;min-height:0;min-width:0;overflow:hidden;touch-action:none;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;border-radius:10px;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.card{pointer-events:auto;background:rgba(15,22,41,.9);color:#eef2fb;border-radius:14px;padding:16px 18px;max-width:min(94%,420px);max-height:100%;overflow:auto;text-align:center;line-height:1.6}
.card h2{margin:0 0 6px;font-size:1.3rem}
.card .txt{margin:0 0 12px;font-size:.92rem;color:#c9d3ea}
.card .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.card .big{font-size:1.9rem;color:var(--star);letter-spacing:4px;line-height:1.2;margin:2px 0 6px}
.card .new{color:var(--star);font-weight:800}
.lvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 2px}
.card .lv{border-radius:10px;padding:8px 4px;background:#2c3d68;color:#eef2fb;line-height:1.35;font-weight:800}
.card .lv .st{display:block;color:var(--star);letter-spacing:1px}
.card .lv small{display:block;color:#c9d3ea;font-size:.72rem;font-weight:500}
.card .lv:disabled{opacity:.4;cursor:default}
.card .lv:focus-visible{outline:3px solid #fff;outline-offset:2px}
.card button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 26px;background:var(--star);color:#1b2747;cursor:pointer}
.card .sub{background:transparent;color:#eef2fb;border:1.5px solid #8d9bbd;padding:9px 18px}
.card button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hidden{display:none}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
.pad{border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-size:1.3rem;font-weight:800;touch-action:none;cursor:pointer}
.pad.on{background:var(--btn-press)}
.pad:focus-visible,.flash:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.u{grid-column:2;grid-row:1}.l{grid-column:1;grid-row:2}.r{grid-column:3;grid-row:2}.d{grid-column:2;grid-row:3}
.flash{position:relative;width:92px;height:92px;border-radius:50%;border:0;background:var(--star);color:#1b2747;font:inherit;font-weight:800;font-size:1rem;touch-action:none;cursor:pointer;overflow:hidden}
.flash .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(27,39,71,.45);height:0%}
.flash span{position:relative}
.keys{display:none;font-size:.85rem;color:var(--muted);text-align:center;line-height:1.7}
.keys kbd{font:inherit;font-weight:800;color:var(--ink);background:var(--btn);border-radius:5px;padding:0 6px;margin:0 1px}
.pause{font:inherit;font-weight:800;border:0;border-radius:8px;background:var(--btn);color:var(--btn-ink);padding:2px 10px;cursor:pointer}
.pause:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
/* マウスとキーボードの環境（PC）では画面のボタンを隠し、キー操作の案内を出す */
@media (hover:hover) and (pointer:fine){ .controls{display:none} .keys{display:block} }
/* スマホ横持ち: 左に十字ボタン、中央にステージ、右にひかりボタン（携帯ゲーム機の配置） */
@media (orientation: landscape) and (pointer: coarse){
  .app{max-width:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"head head head" "pad stage fl";gap:4px 14px;
    padding:4px max(14px, env(safe-area-inset-right, 0px)) 6px max(14px, env(safe-area-inset-left, 0px))}
  header{grid-area:head}
  h1{font-size:1rem}
  .hud{font-size:.85rem;gap:10px}
  .stage{grid-area:stage}
  .controls{display:contents}
  .dpad{grid-area:pad;align-self:center}
  .flash{grid-area:fl;align-self:center}
  .keys{display:none}
}
@media (prefers-reduced-motion: reduce){ .card{transition:none} }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ほしひろい</h1>
    <div class="hud">
      <span id="hudLevel">面 1</span>
      <span class="star" id="hudStars">★ 0/0</span>
      <span id="hudFriends">☺ 0/0</span>
      <span id="hudLives">♥ 3</span>
      <span id="hudTime">⏱ 0</span>
      <span id="hudFlash">✦ ✓</span>
      <button class="pause" id="pauseBtn" aria-label="一時停止">⏸</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay">
      <div class="card" id="card">
        <h2 id="cardTitle">ほしひろい</h2>
        <div class="txt" id="cardText"></div>
        <div class="btns" id="cardBtns"></div>
      </div>
    </div>
  </div>

  <div class="keys">
    移動 <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> または <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
    　ひかり <kbd>Space</kbd> / <kbd>Z</kbd>　一時停止 <kbd>P</kbd> / <kbd>Esc</kbd>
  </div>
  <div class="controls">
    <div class="dpad">
      <button class="pad u" data-dir="U" aria-label="上">▲</button>
      <button class="pad l" data-dir="L" aria-label="左">◀</button>
      <button class="pad r" data-dir="R" aria-label="右">▶</button>
      <button class="pad d" data-dir="D" aria-label="下">▼</button>
    </div>
    <button class="flash" id="flashBtn" aria-label="ひかり"><div class="cd" id="flashCd"></div><span>ひかり</span></button>
  </div>
</div>

<script>
(() => {
"use strict";

/* ================= ステージデータ =================
  # 床   H はしご   - ロープ   $ 星   * ロープ上の星   F 取り残された仲間
  X 出口(星を全部取ると出現)   P プレイヤー   E 追っ手      */
const LEVELS = [
[ // 1: はじめての救出
"....................",
"..$......X.....E.$..",
"##H######H#######H##",
"..H......H.......H..",
"..H..$...H...$.F.H..",
"######H##H##H#######",
"......H..H..H.......",
"..$...H-----H...$...",
"####H#########H#####",
"....H.........H.....",
"....H..$...$..H.....",
"####H###H#####H###H#",
"P...H...H.....H.E.H.",
"####################",
],
[ // 2: ロープの橋
"$....E....X........$",
"#H######..H..######H",
".H........H........H",
".H..$..F..H.....$..H",
"####H#####H#####H###",
"....H.....H.....H...",
"....H--*--H--*--H...",
"....H.....H.....H...",
"##H###H#######H###H#",
"..H...H...$...H..EH.",
"..H...H###.###H...H.",
"..H...H.......H...H.",
"P.H.$.H...E.F.H.$.H.",
"####################",
],
[ // 3: 落とし穴
"E.........X.......E$",
"##H#####..H..#####H#",
"..H.......H.......H.",
"..H-----*.H.*-----H.",
"..H.......H....F..H.",
"#######H###H########",
".$..F..H...H.....$.E",
"####H###...###H#####",
"....H----*-----H....",
"....H..........H....",
"#H######H##H######H#",
".H......H..H......H.",
".H.P..$.H..H.$E...H.",
"####################",
],
[ // 4: 二つの塔
"........X...........",
".F..$...H...$....F..",
"####H###H###H###H###",
"....H...H...H...H...",
"..$.H...H-*-H...H.$.",
"#######.H...H.######",
".......#H...H#......",
"..E....#H...H#...E..",
"#####H##H...H##H####",
".....H..H.F.H..H....",
".....H..H###H..H....",
".....H..H...H..H....",
"P.$..H..H...H..H..$.",
"####################",
],
[ // 5: 吹き抜け
"$.......$X.........$",
"#H######H#H######H##",
".H......H.H......H..",
".H.F....H.H....$.H..",
"####H###H.H###H#####",
"....H...H.H...H.....",
"..$.H...H-H...H..F..",
"####H###H.H###H#####",
"....H...H.H...H.....",
"..E.H..$H.H...H.E...",
"#####H##H.H##H######",
".....H..H.H..H......",
"P..$.H..H.HF.H..$...",
"####################",
],
[ // 6: みんなで帰ろう
"F.......$X$.......F.",
"##H##############H##",
"..H......E.......H..",
"..H--*---H---*---H..",
"..H......H.......H..",
"#####H###H####H#####",
"..$..H...F....H..$..",
"#####H###H####H#####",
".....H...H....H.....",
"..E..H...H....H..E..",
"##H######H######H###",
"..H......H......H...",
"P.H..$...H..F...H..$",
"####################",
],
];
const COLS = 20, ROWS = 14;
const EMPTY = 0, SOLID = 1, LADDER = 2, BAR = 3;

/* ================= 状態 ================= */
let grid, stars, exitPos, player, enemies, particles, rings;
let friends = [], chain = [];            // chain[0] がプレイヤーのすぐ後ろ、最後が列の最後尾
let levelTime = 0, misses = 0, par = 60, result = null;
let records = {};                          // 面ごとの自己ベスト {stars, time}
try { records = JSON.parse(localStorage.getItem("hoshihiroi.records") || "{}") || {}; } catch (_) {}
function saveRecords() { try { localStorage.setItem("hoshihiroi.records", JSON.stringify(records)); } catch (_) {} }
let level = 0, lives = 3, mode = "title", modeTimer = 0, exitAlpha = 0;
let flashCool = 0; const FLASH_CD = 4.5;
let T = 32, dpr = 1, time = 0;
let colors = {};

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

/* ================= 地形の判定 ================= */
function tile(x, y) {
  if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return SOLID;
  return grid[y][x];
}
const solid  = (x, y) => tile(x, y) === SOLID;
const ladder = (x, y) => tile(x, y) === LADDER;
const bar    = (x, y) => tile(x, y) === BAR;
const canEnter = (x, y) => !solid(x, y);
function supported(x, y) {
  return solid(x, y + 1) || ladder(x, y) || ladder(x, y + 1) || bar(x, y);
}
// 1マス先へ進めるか（プレイヤーも追っ手も同じルール）
function canMove(x, y, d) {
  if (d === "L") return canEnter(x - 1, y);
  if (d === "R") return canEnter(x + 1, y);
  if (d === "U") return ladder(x, y) && canEnter(x, y - 1);
  if (d === "D") return canEnter(x, y + 1) && (ladder(x, y) || ladder(x, y + 1) || bar(x, y));
  return false;
}
const DX = { L: -1, R: 1, U: 0, D: 0 }, DY = { L: 0, R: 0, U: -1, D: 1 };

/* ================= ステージ読み込み ================= */
function loadLevel(n) {
  const src = LEVELS[n];
  grid = []; stars = []; exitPos = null; enemies = []; particles = []; rings = []; friends = []; chain = [];
  let ps = null; const es = [];
  for (let y = 0; y < ROWS; y++) {
    const row = [];
    for (let x = 0; x < COLS; x++) {
      const c = src[y][x];
      let t = EMPTY;
      if (c === "#") t = SOLID;
      else if (c === "H") t = LADDER;
      else if (c === "-" || c === "*") t = BAR;
      if (c === "$" || c === "*") stars.push({ x, y, got: false, seed: Math.random() * 6 });
      if (c === "X") exitPos = { x, y };
      if (c === "P") ps = { x, y };
      if (c === "E") es.push({ x, y });
      if (c === "F") friends.push(makeFriend(x, y));
      row.push(t);
    }
    grid.push(row);
  }
  level = n; exitAlpha = 0; flashCool = 0; levelTime = 0; misses = 0; result = null;
  levelStart = { ps, es };
  spawnActors();
  par = estimatePar(ps);
  updateHud();
}
let levelStart = null;
function makeFriend(x, y) {
  const f = makeActor(x, y, "friend", colors.friend, 3.8);
  f.home = { x, y }; f.joined = false; f.gone = false; f.q = [];
  f.face = f.faceS = Math.random() < 0.5 ? -1 : 1;
  return f;
}
function spawnActors() {
  player = makeActor(levelStart.ps.x, levelStart.ps.y, "player", colors.player, 3.8);
  enemies = [];
  const espeed = Math.min(2.4 + level * 0.15, 3.4);
  const palette = [colors.e1, colors.e2, colors.e3, colors.e4, colors.e1];
  levelStart.es.forEach((s, i) => {
    const e = makeActor(s.x, s.y, "enemy", palette[i], espeed * (0.94 + i * 0.04));
    e.order = shuffle(["L", "R", "U", "D"]);
    e.wait = 0.6 + i * 0.5;  // 出だしをずらす
    e.tail = i % 2 === 1;    // 奇数番目の追っ手は「列の最後尾」を狙う
    enemies.push(e);
  });
  // 助けた仲間はスタート地点に集合し直す（列の順番はそのまま）
  player.next = chain[0] || null;
  for (const f of chain) {
    f.x = f.fx = f.tx = player.x; f.y = f.fy = f.ty = player.y;
    f.moving = false; f.falling = false; f.q = [];
  }
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ================= キャラクター ================= */
function makeActor(x, y, kind, color, speed) {
  return {
    x, y, fx: x, fy: y, tx: x, ty: y, moving: false, falling: false,
    face: 1, faceS: 1, phase: 0, kind, color, speed, stun: 0, wait: 0, fallT: 0,
    gp: 0, rig: null, from: null, group: null, blend: 1, next: null, seed: Math.random() * 6,
  };
}
function setTarget(a, x, y) {
  // 後ろについてくる仲間に「いま出発したマス」を伝える（仲間はこの道順をそのままたどる）
  if (a.next) a.next.q.push({ x: a.x, y: a.y });
  a.fx = a.x; a.fy = a.y; a.tx = x; a.ty = y; a.moving = true;
}

// 次の1マスを決める。true なら移動開始
function decide(a, want) {
  const x = a.x, y = a.y;
  if (!supported(x, y)) {
    if (!a.falling) a.fallT = 0;
    a.falling = true; setTarget(a, x, y + 1); return true;
  }
  if (a.falling) { a.falling = false; land(a); }
  // want は方向1つ、または優先順の配列。進めない方向は飛ばして次を試す
  const list = Array.isArray(want) ? want : (want ? [want] : []);
  for (const w of list) {
    if (!canMove(x, y, w)) continue;
    if (w === "L") a.face = -1;
    if (w === "R") a.face = 1;
    setTarget(a, x + DX[w], y + DY[w]);
    a.lastDir = w;
    return true;
  }
  return false;
}

function step(a, dt, getWant) {
  let rem = dt, guard = 4;
  while (rem > 0 && guard-- > 0) {
    if (!a.moving) {
      if (!decide(a, getWant())) break;
      if (a.kind === "player" && a.lastDir === buffered) buffered = null; // 先行入力を使い切った
    } else if (a.kind === "player" && !a.falling) {
      // 移動中でも逆方向キーで即折り返し（操作の気持ちよさ）
      const ws = getWant(), w = Array.isArray(ws) ? ws[0] : ws, dx = a.tx - a.fx, dy = a.ty - a.fy;
      const rev = (w === "L" && dx > 0) || (w === "R" && dx < 0) ||
        ((w === "U" && dy > 0) || (w === "D" && dy < 0)) && (ladder(a.fx, a.fy) || ladder(a.tx, a.ty));
      if (rev) {
        [a.fx, a.tx] = [a.tx, a.fx]; [a.fy, a.ty] = [a.ty, a.fy];
        if (dx) a.face = -a.face;
      }
    }
    // はしごは少しゆっくり、ロープもやや遅く（手足の持ちかえが速くなりすぎないように）
    const sp = a.falling ? 7.5 : a.speed * (a.ty !== a.fy ? ((ladder(a.fx, a.fy) || ladder(a.tx, a.ty)) ? LADDER_SPEED : 1) : bar(Math.round(a.x), Math.round(a.y)) ? 0.85 : 1);
    const ddx = a.tx - a.x, ddy = a.ty - a.y;
    const dist = Math.abs(ddx) + Math.abs(ddy);
    const can = sp * rem;
    const moved = Math.min(dist, can);
    if (dist > 0) { a.x += Math.sign(ddx) * Math.min(Math.abs(ddx), moved); a.y += Math.sign(ddy) * Math.min(Math.abs(ddy), moved); }
    if (ddy === 0 && !a.falling) a.gp += moved / STRIDE; // 走りの位相は「進んだ距離」だけで進む
    if (can >= dist) {
      a.x = a.tx; a.y = a.ty; a.moving = false;
      rem -= dist / sp;
      if (a.falling && supported(a.x, a.y)) { a.falling = false; land(a); }
    } else rem = 0;
  }
  if (a.falling) a.fallT += dt;
}

function land(a) {
  if (a.fallT > 0.12) {
    for (let i = 0; i < 7; i++) particles.push({
      x: a.x + 0.5, y: a.y + 1, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 1.5,
      life: 0.45, max: 0.45, color: colors.bar, r: 0.05 + Math.random() * 0.04 });
  }
  a.fallT = 0;
}

/* ================= 追っ手のAI（幅優先探索で最短経路） ================= */
function neighbors(x, y, order) {
  if (!supported(x, y)) return y + 1 < ROWS ? [[x, y + 1, "D"]] : [];
  const out = [];
  for (const d of order) if (canMove(x, y, d)) out.push([x + DX[d], y + DY[d], d]);
  return out;
}
function aiWant(e) {
  const tgt = (e.tail && chain.length && mode === "play") ? chain[chain.length - 1] : player;
  const gx = Math.round(tgt.x), gy = Math.round(tgt.y);
  const key = (x, y) => y * COLS + x;
  const first = new Map(); first.set(key(e.x, e.y), null);
  const q = [[e.x, e.y]];
  while (q.length) {
    const [x, y] = q.shift();
    if (x === gx && y === gy) return first.get(key(x, y));
    for (const [nx, ny, d] of neighbors(x, y, e.order)) {
      const k = key(nx, ny);
      if (first.has(k)) continue;
      first.set(k, first.get(key(x, y)) || d);
      q.push([nx, ny]);
    }
  }
  // 届かないときは近づく方向へ
  let best = null, bd = 1e9;

// 走り: 位相 a.gp は「進んだ距離 ÷ STRIDE」。接地中の足は体の移動と同じ速さで後ろへ

// はしご: はしごの方を向いた後ろ姿。対角の手足が組になって

/* ================= 描画: 棒人間 ================= */

/* ================= 描画: 地形など ================= */

}

/* ================= 入力 ================= */

/* ================= 仲間の列 =================

// 目標タイム: スタートから「一番近い星・仲間」を順に回って出口へ行く所要時間を計算し、余裕をもたせる

// タイトル画面のデモ: プレイヤーも自動で逃げ回る
let demoTarget = null;
function demoTick(dt) {

  const key = (x, y) => y * COLS + x, first = new Map(); first.set(key(sx, sy), null);

  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - r * 0.3, y + r * 0.8); ctx.lineTo(x, y + r * 1.5); ctx.lineTo(x + r * 0.35, y + r * 0.75); ctx.fill();
  ctx.fillStyle = colors.stage; ctx.font = `800 ${Math.round(r * 1.5)}px sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("!", x, y + r * 0.05);
  ctx.globalAlpha = 1;
}
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawWorld();
  const dt = frameDt;
  for (const f of friends) {
    if (f.gone) continue;
    updateRig(f, dt, f.joined ? null : "wave"); drawFigure(f);
    if (!f.joined) drawHelp(f);
  }
  for (const e of enemies) { updateRig(e, dt); drawFigure(e); }
  if (mode === "dying") {
    // つかまったプレイヤーは消えていく
    ctx.globalAlpha = Math.max(0, modeTimer / 1.3);
    updateRig(player, dt, "fall"); drawFigure(player);
    ctx.globalAlpha = 1;
  } else {
    updateRig(player, dt, mode === "clear" ? "cheer" : null); drawFigure(player);
  }
  drawFx();
}

/* ================= スワイプ操作（ステージ上） =================
  指を置いて滑らせた方向へ進む。指を置いたままなら進み続け、
  そこから別の方向へ少しずらすだけで方向転換。軽くタップすると「ひかり」 */
const stageEl = document.getElementById("stage");
const SWIPE_PX = 16;   // この距離（px）動かしたら方向とみなす
const TAP_MS = 280;    // これより短く、ほとんど動かさなければタップ
let sw = null;
stageEl.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" || sw || e.target.closest(".card")) return;
  e.preventDefault(); audioInit();
  try { stageEl.setPointerCapture(e.pointerId); } catch (_) {}
  sw = { id: e.pointerId, ax: e.clientX, ay: e.clientY, t: performance.now(), dir: null, moved: false };
});
stageEl.addEventListener("pointermove", e => {
  if (!sw || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.ax, dy = e.clientY - sw.ay;
  if (Math.hypot(dx, dy) < SWIPE_PX) return;
  const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : (dy > 0 ? "D" : "U");
  sw.moved = true;
  if (d !== sw.dir) { if (sw.dir) release(sw.dir); press(d); sw.dir = d; buzz(6); }
  sw.ax = e.clientX; sw.ay = e.clientY; // 基準点を指に追従させる
});
function swipeEnd(e) {
  if (!sw || e.pointerId !== sw.id) return;
  if (sw.dir) release(sw.dir);
  else if (!sw.moved && performance.now() - sw.t < TAP_MS && mode === "play") doFlash();
  sw = null;
}
stageEl.addEventListener("pointerup", swipeEnd);
stageEl.addEventListener("pointercancel", swipeEnd);
stageEl.addEventListener("contextmenu", e => e.preventDefault());

/* ================= 起動 ================= */
const hudFlash = document.getElementById("hudFlash"), hudTime = document.getElementById("hudTime");
addEventListener("orientationchange", () => setTimeout(resize, 150));
readColors();
const mq = matchMedia("(prefers-color-scheme: dark)");
mq.addEventListener && mq.addEventListener("change", readColors);
resize();
loadLevel(0);
showTitle();
requestAnimationFrame(frame);

// 動作確認用（ゲームには影響しない）
window.__game = { LEVELS, COLS, ROWS, startLevel, pathTo,
  info: () => ({ mode, level, par, lives, misses, time: levelTime, chain: chain.length, friends: friends.length,
    stars: stars.filter(s => s.got).length, starTotal: stars.length, player: { x: player.x, y: player.y, tx: player.tx, ty: player.ty, moving: player.moving },
    targets: [...stars.filter(s => !s.got), ...friends.filter(f => !f.joined).map(f => f.home)], exit: exitPos, card: cardTitle.textContent }),
  freezeEnemies: () => enemies.forEach(e => e.wait = 1e9) };
})();
</script>
